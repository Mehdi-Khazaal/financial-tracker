name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: 0123456789abcdef0123456789abcdef
      DATABASE_URL: sqlite:///./ci.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt
      - name: Run backend tests with coverage
        run: pytest tests -q --cov=services --cov=routers --cov=utils --cov=models --cov-report=json:coverage.json --cov-report=term:skip-covered
      - name: Enforce coverage floors on money and account code
        run: python scripts/check_coverage.py coverage.json
      - name: Migrations apply, revert and re-apply cleanly (SQLite)
        run: |
          rm -f migrations.db
          DATABASE_URL=sqlite:///./migrations.db alembic upgrade head
          DATABASE_URL=sqlite:///./migrations.db alembic downgrade base
          DATABASE_URL=sqlite:///./migrations.db alembic upgrade head

  migrations-postgres:
    # SQLite reflects too little to prove a migration is right, and production
    # is Postgres. This builds the chain on a real Postgres, checks it against
    # the models, and walks it all the way down and up again.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintrack_ci
      SECRET_KEY: 0123456789abcdef0123456789abcdef
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the schema with the migration chain
        run: alembic upgrade head
      - name: The chain matches the models (tables, columns, types, indexes, keys)
        run: python scripts/check_schema_drift.py
      - name: Every revision reverts and re-applies
        run: |
          alembic downgrade base
          alembic upgrade head
          python scripts/check_schema_drift.py

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests with coverage floors
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build
      - name: Enforce bundle budget
        run: npm run check:bundle
      - name: Audit production dependencies
        run: npx audit-ci --config audit-ci.jsonc
      - name: Keep the build for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, migrations-postgres]
    env:
      SECRET_KEY: e2e-test-secret-key-0123456789abcdef
      DATABASE_URL: sqlite:///./e2e.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Restore the production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite (functional specs and the WCAG 2.2 AA scan)
        working-directory: frontend
        run: npx playwright test
      - name: Upload the accessibility screenshots (390 px and 1440 px)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-screenshots
          path: frontend/e2e/__screenshots__/phase5
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
