name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: 0123456789abcdef0123456789abcdef
      DATABASE_URL: sqlite:///./ci.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt
      - name: Run backend tests
        run: pytest tests -q
      - name: Migrations apply, revert and re-apply cleanly
        run: |
          rm -f migrations.db
          DATABASE_URL=sqlite:///./migrations.db alembic upgrade head
          DATABASE_URL=sqlite:///./migrations.db alembic downgrade base
          DATABASE_URL=sqlite:///./migrations.db alembic upgrade head

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build
      - name: Enforce bundle budget
        run: npm run check:bundle
      - name: Audit production dependencies
        run: npx audit-ci --config audit-ci.jsonc
      - name: Keep the build for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      SECRET_KEY: e2e-test-secret-key-0123456789abcdef
      DATABASE_URL: sqlite:///./e2e.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Restore the production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
